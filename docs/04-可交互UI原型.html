<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>净界 · 全页面交互原型</title><style>
:root{color-scheme:dark;--bg:#101915;--sidebar:#131d18;--surface:#1a2720;--surface2:#23332a;--line:#314137;--text:#eff2e9;--muted:#9dad9e;--accent:#add4b0;--accentText:#142419;--gold:#dec38d;--red:#d9a5a0;--shadow:0 24px 70px #0006}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.app{display:flex;min-height:100vh}.sidebar{width:218px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 14px 18px;position:sticky;top:0;height:100vh}.brand{padding:0 14px 32px;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;letter-spacing:.12em}.brandmark{width:32px;height:32px;border-radius:12px 12px 17px 17px;background:radial-gradient(circle at 65% 25%,#def0d9 0 7%,transparent 8%),linear-gradient(145deg,#b8d9b9,#52795e);box-shadow:inset -5px -6px 10px #10271955}.navsection{font-size:11px;letter-spacing:.2em;color:var(--muted);padding:0 14px 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button,.sidebottom button{display:flex;align-items:center;gap:13px;border:0;color:var(--muted);background:transparent;text-align:left;width:100%;padding:10px 14px;border-radius:10px}.nav button:hover,.sidebottom button:hover{background:var(--surface2);color:var(--text)}.nav button.active{color:var(--text);background:var(--surface2);box-shadow:inset 3px 0 var(--accent)}.nav button.soslink{color:var(--accent)}.ico{display:inline-flex;width:19px;font-size:17px;align-items:center;justify-content:center}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.status{padding:10px 14px;color:var(--muted);font-size:12px}.status:before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:7px}.main{flex:1;min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 46px;border-bottom:1px solid var(--line)}.topbar .eyebrow{color:var(--muted);font-size:12px;letter-spacing:.16em}.topactions{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.topactions button{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 13px}.content{max-width:1230px;margin:0 auto;padding:42px 46px 80px}.kicker{color:var(--accent);font-size:12px;letter-spacing:.18em;text-transform:uppercase}.page-title{font-size:32px;font-weight:500;letter-spacing:-.04em;margin:7px 0 8px;line-height:1.3}.subtitle{color:var(--muted);margin:0 0 30px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grid{display:grid;gap:18px}.g2{grid-template-columns:1.35fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:25px}.card.soft{background:linear-gradient(120deg,#243c2d,#1a2720 74%)}.card h2,.card h3{font-weight:500;margin:0 0 15px}.card h2{font-size:18px}.card h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.line{border-top:1px solid var(--line);margin:20px 0}.btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 16px;min-height:42px}.btn:hover{filter:brightness(1.13)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:600}.btn.ghost{background:transparent}.btn.text{border:0;background:none;color:var(--accent);padding:6px}.btn.warn{color:var(--gold)}.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;background:#add4b01c;color:var(--accent);font-size:12px}.pill.warn{background:#dec38d21;color:var(--gold)}.metric{font-size:34px;line-height:1.25;font-weight:500;letter-spacing:-.04em;margin-bottom:8px}.hero{min-height:277px;padding:32px 35px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-66px;top:-88px;border:1px solid #b9d9b340;box-shadow:0 0 0 35px #b9d9b313,0 0 0 78px #b9d9b30b}.hero>*{position:relative;z-index:1}.hero h2{font-size:30px;line-height:1.35;margin:21px 0 12px;letter-spacing:-.035em}.hero p{max-width:470px;color:#cbdbcb;margin-bottom:26px}.statline{display:flex;gap:30px;margin-top:22px}.statline strong{font-size:23px;font-weight:500;display:block}.statline span{color:var(--muted);font-size:12px}.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.item:last-child{border-bottom:0}.item b{font-weight:500}.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;margin-right:10px}.dot.gold{background:var(--gold)}.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);display:inline-block;margin:3px 5px 3px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}.field{margin:18px 0}.field label{display:block;margin-bottom:8px;color:var(--text)}input[type=text],input[type=password],input[type=datetime-local],textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:42px}textarea{min-height:105px;resize:vertical}.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.chip{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:9px;padding:8px 12px}.seg button.selected,.chip.selected{background:#add4b026;border-color:var(--accent);color:var(--accent)}.chip{display:inline-block;margin:3px}.checkrow{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.checkrow:last-child{border-bottom:0}.checkrow input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px}.checkrow .muted{display:block;font-size:12px}.chart{height:180px;display:flex;align-items:end;justify-content:space-between;gap:9px;padding:8px 0 0}.chartcol{flex:1;display:flex;align-items:center;flex-direction:column;gap:8px;height:100%;justify-content:end;color:var(--muted);font-size:11px}.bar{background:linear-gradient(180deg,#b4d7b2,#547861);width:100%;border-radius:6px 6px 3px 3px;min-height:4px}.trend{display:flex;gap:4px;align-items:end;height:44px}.trend i{width:12px;background:var(--accent);border-radius:3px;opacity:.7}.timeline{border-left:1px solid var(--line);padding-left:24px;margin-left:7px}.timeline .item{position:relative}.timeline .item:before{content:"";position:absolute;left:-29px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.breath{width:188px;height:188px;border-radius:50%;margin:25px auto;display:grid;place-items:center;background:radial-gradient(circle,#a2cfad30,#a2cfad10 61%,transparent 62%);border:1px solid #a2cfad70;box-shadow:0 0 0 25px #a2cfad12,0 0 0 50px #a2cfad09}.breath.live{animation:breathe 8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.09);box-shadow:0 0 0 35px #a2cfad14,0 0 0 70px #a2cfad08}}@media(prefers-reduced-motion:reduce){.breath.live{animation:none}}.center{text-align:center}.timer{font:500 42px ui-monospace,monospace;letter-spacing:-.05em}.over{position:fixed;inset:0;z-index:10;background:#07110dcf;display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.modal h2{font-size:22px;font-weight:500;margin:0 0 7px}.modal .footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.onboard,.lockscreen,.blocked{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(ellipse at 80% 0%,#2b4631 0%,var(--bg) 52%)}.onboard .panel,.lockscreen .panel,.blocked .panel{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:44px}.onboard .panel h1,.lockscreen .panel h1,.blocked .panel h1{font-weight:500;font-size:32px;margin:15px 0}.onboard .panel p,.lockscreen .panel p,.blocked .panel p{color:var(--muted)}.rule{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:15px}.rule:last-child{border:0}.toggle{width:38px;height:22px;border-radius:20px;background:var(--accent);border:0;position:relative;flex:none}.toggle:before{content:"";position:absolute;left:19px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--accentText)}.toggle.off{background:var(--line)}.toggle.off:before{left:3px;background:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;z-index:30;padding:11px 16px;border-radius:10px;background:var(--accent);color:var(--accentText);box-shadow:var(--shadow)}.theme-light{color-scheme:light;--bg:#f3f5ef;--sidebar:#e8eee7;--surface:#fffefa;--surface2:#eaf1e8;--line:#d5dfd4;--text:#233328;--muted:#617166;--accent:#3c7950;--accentText:#ffffff;--gold:#906d34;--red:#a5534e;--shadow:0 24px 70px #183a2222}.theme-light .hero{background:linear-gradient(120deg,#d9e9d8,#fffefa 75%)}.theme-light .hero p{color:var(--muted)}.theme-light .hero:after{border-color:#3c795044}.theme-light .over{background:#243328a8}.theme-light .onboard,.theme-light .lockscreen,.theme-light .blocked{background:radial-gradient(ellipse at 80% 0%,#d5e8d5,var(--bg) 52%)}.theme-light .bar{background:linear-gradient(180deg,#74ac7d,#3c7950)}.theme-light .pill{background:#3c79501c}.theme-light .seg button.selected,.theme-light .chip.selected{background:#3c79501a}@media(max-width:1000px){.sidebar{width:75px;padding-left:9px;padding-right:9px}.brand span,.navsection,.nav button .navlabel,.sidebottom .navlabel,.status{display:none}.brand{padding-left:12px}.nav button{justify-content:center}.topbar{padding:0 25px}.content{padding:30px 25px}.g2{grid-template-columns:1fr}}@media(max-width:720px){.g3{grid-template-columns:1fr}.topactions .date{display:none}.content{padding:25px 18px}.topbar{padding:0 18px}.hero{padding:24px}.statline{gap:18px}.page-title{font-size:27px}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');const state={page:'today',modal:null,light:false,onStep:0,records:[{type:'出现冲动',when:'今天 22:14',triggers:'疲劳 · 无聊',note:''},{type:'主动停止浏览',when:'昨天 23:08',triggers:'压力',note:'关掉页面，出去走了一会儿。'},{type:'替代行动',when:'周二 21:40',triggers:'睡不着',note:'写下当时的想法。'}],plan:[false,true,false],insight:7,phase:'ready',seconds:90,interval:null,pauseRemaining:8,pauseTimer:null,theme:null,rules:['example.org','media.example'],ruleOn:[true,true],recordType:'出现冲动',triggers:[],journalText:'',journalSaved:['最近发现，下班后很累的时候，我常常只是想找一个容易获得的刺激。先休息十分钟再决定。'],locked:false};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,act,cls='')=>`<button class="btn ${cls}" data-action="${act}">${label}</button>`;const title=(k,t,s)=>`<div class="kicker">${k}</div><h1 class="page-title">${t}</h1><p class="subtitle">${s}</p>`;const card=(content,cls='')=>`<section class="card ${cls}">${content}</section>`;
const icons={today:'◒',records:'▤',sos:'◉',plan:'◇',insights:'▥',journal:'≋',blocker:'⊘',settings:'⚙'};const labels={today:'今日',records:'记录',sos:'SOS',plan:'计划',insights:'洞察',journal:'日记',blocker:'屏蔽',settings:'设置'};function shell(inner){return `<div class="app"><aside class="sidebar"><div class="brand"><i class="brandmark"></i><span>净界</span></div><div class="navsection">我的空间</div><nav class="nav">${Object.keys(labels).filter(x=>x!=='settings').map(k=>`<button data-page="${k}" aria-label="${labels[k]}" class="${state.page===k?'active':''} ${k==='sos'?'soslink':''}"><span class="ico">${icons[k]}</span><span class="navlabel">${labels[k]}</span></button>`).join('')}</nav><div class="sidebottom"><button data-page="settings"><span class="ico">⚙</span><span class="navlabel">设置与隐私</span></button><div class="status">本地演示 · 离线界面</div></div></aside><main class="main"><header class="topbar"><div class="eyebrow">净界 / ${labels[state.page]}</div><div class="topactions"><span class="date">2026 年 9 月 26 日 · 演示数据</span><button data-action="lock">锁定</button></div></header><div class="content">${inner}</div></main></div>`}
function today(){return `${title('TODAY / 01','今晚，先照顾好自己。','这是一处安静的记录空间。你可以观察，也可以先休息。')}<div class="grid g2">${card(`<div class="kicker">当前计划 · 演示</div><h2>把冲动与行动之间<br>留出一点空间。</h2><p>今天想做的，只是一件能照顾自己的小事。</p><div class="actions">${btn('开始 SOS','go-sos','primary')}${btn('记下一次观察','record','ghost')}</div>`,'hero soft')}${card(`<div class="row between"><h2>近 7 天概览</h2><span class="pill">演示数据</span></div><div class="statline"><div><strong>5 / 7</strong><span>有记录的日子</span></div><div><strong>3 次</strong><span>主动暂停</span></div></div><div class="line"></div><p class="muted">连续天数只是一个角度。更重要的是，你是否越来越看得见自己的节奏。</p>`)}</div><div class="grid g2" style="margin-top:18px">${card(`<div class="row between"><h2>今天的小行动</h2><button class="btn text" data-page="plan">调整计划 →</button></div>${['睡前十分钟离开屏幕','感觉疲惫时先喝水','冲动出现时先停一分钟'].map((x,i)=>`<label class="checkrow"><input type="checkbox" data-plan="${i}" ${state.plan[i]?'checked':''}><span>${x}<span class="muted">${i===1?'已完成 · 演示':'可随时跳过'}</span></span></label>`).join('')}`)}${card(`<div class="row between"><h2>最近的观察</h2><button class="btn text" data-page="records">全部记录 →</button></div>${state.records.slice(0,3).map(r=>`<div class="item"><div><span class="dot"></span><b>${esc(r.type)}</b><div class="muted small">${esc(r.triggers)}</div></div><span class="muted small">${esc(r.when)}</span></div>`).join('')}`)}</div>`}
function records(){return `${title('LOG / 02','记录，不用评判。','记下当时发生了什么，之后再慢慢看清规律。')}<div class="row between" style="margin-bottom:18px"><span class="pill">近 30 天 · ${state.records.length} 条演示记录</span>${btn('＋ 新建记录','record','primary')}</div><div class="grid g2">${card(`<h2>时间线</h2><div class="timeline">${state.records.map((r,i)=>`<div class="item"><div><b>${esc(r.type)}</b><div class="muted small">${esc(r.when)} · ${esc(r.triggers||'未选触发因素')}</div>${r.note?`<p>${esc(r.note)}</p>`:''}</div><button class="btn text" data-delete="${i}" aria-label="删除${esc(r.type)}">删除</button></div>`).join('')||'<p class="muted">还没有记录。想写时随时可以开始。</p>'}</div>`)}${card(`<h2>记录可以很轻</h2><p class="muted">事件、时间是必填项；强度、触发因素和备注都可以留空。自慰也可以只当作观察项目，不自动判作失败。</p><div class="line"></div><div class="kicker">示例</div><p>“今天很累，点开网页后决定关掉。”</p>${btn('写一条记录','record')}`)}</div>`}
function sos(){let time=`${String(Math.floor(state.seconds/60)).padStart(2,'0')}:${String(state.seconds%60).padStart(2,'0')}`;return `${title('PAUSE / 03','先停一会儿。','冲动可以被观察，不需要立刻决定下一步。')}<div class="grid g2">${card(`<div class="center"><span class="pill">${state.phase==='ready'?'准备开始':state.phase==='done'?'已完成一段暂停':'呼吸练习'}</span><div class="breath ${state.phase==='running'?'live':''}"><div><div class="timer">${time}</div><div class="muted">${state.phase==='running'?'慢慢呼吸':state.phase==='paused'?'已暂停':'按照自己的节奏'}</div></div></div><div class="actions" style="justify-content:center">${state.phase==='ready'?btn('开始 90 秒','sos-start','primary'):state.phase==='running'?btn('暂停','sos-pause'):state.phase==='paused'?btn('继续','sos-resume','primary'):''}${state.phase!=='done'?btn('跳过练习','sos-done','ghost'):btn('重新开始','sos-reset')}</div></div>`)}${card(`<h2>${state.phase==='done'?'现在想做什么？':'不需要做对，只需要停下片刻。'}</h2><p class="muted">${state.phase==='done'?'挑一件最容易做到的事，或者直接结束。':'你可以随时暂停、跳过或离开。完成与否都不会影响你的计划。'}</p><div class="line"></div><div class="seg">${['喝点水','离开屏幕','写下此刻'].map(x=>`<button data-action="sos-choice" data-value="${x}">${x}</button>`).join('')}</div><div class="field"><label for="urgeRange">当前冲动强度（可跳过） <span id="urgeValue">5</span> / 10</label><input id="urgeRange" type="range" min="0" max="10" value="5" style="width:100%;accent-color:var(--accent)"></div>${btn('结束并离开','sos-finish','ghost')}`)}</div>`}
function plan(){return `${title('PLAN / 04','一个能调整的计划。','方向由你决定。小行动可以暂停，也不必每天完成。')}<div class="grid g2">${card(`<span class="pill">进行中 · 演示目标</span><h2 style="font-size:24px;margin-top:18px">减少深夜色情内容浏览</h2><p class="muted">原因：希望睡前获得更稳定的休息，也想降低自动打开网页的次数。</p><div class="line"></div><div class="actions">${btn('编辑目标','edit-goal')}${btn('暂停目标','pause-goal','ghost')}</div>`)}${card(`<h2>本周轻量目标</h2><div class="metric">${state.plan.filter(Boolean).length} / 3</div><p class="muted">今天完成的小行动。没完成也无需补偿。</p><div class="trend">${[14,26,20,38,30,44,28].map(h=>`<i style="height:${h}px"></i>`).join('')}</div>`)}</div><div style="margin-top:18px">${card(`<div class="row between"><h2>我的小行动</h2>${btn('＋ 添加行动','add-action','ghost')}</div>${['睡前十分钟离开屏幕','感觉疲惫时先喝水','冲动出现时先停一分钟'].map((x,i)=>`<label class="checkrow"><input type="checkbox" data-plan="${i}" ${state.plan[i]?'checked':''}><span>${x}<span class="muted">${state.plan[i]?'今天已完成':'还没有记录完成'}</span></span></label>`).join('')}`)}</div>`}
function insights(){let bars=state.insight===7?[9,13,7,17,24,15,31,37,29,42,58,35,49,68,44,25,20,14,11,8,5,4,3,2]:[10,14,9,19,24,29,38,32,26,43,48,53,61,70,64,35,30,23,17,13,9,7,5,3];return `${title('INSIGHTS / 05','把规律看清一点。','统计只整理你亲自留下的记录，不推断健康或诊断。')}<div class="row between" style="margin-bottom:18px"><div class="seg"><button data-insight="7" class="${state.insight===7?'selected':''}">近 7 天</button><button data-insight="30" class="${state.insight===30?'selected':''}">近 30 天</button></div><span class="muted small">演示数据 · 2026/09/01—09/26</span></div><div class="grid g3">${card(`<div class="muted">有记录的日子</div><div class="metric">${state.insight===7?'5 / 7':'18 / 30'}</div><span class="small muted">分母为统计期天数</span>`)}${card(`<div class="muted">记录的冲动</div><div class="metric">${state.insight===7?'7':'23'} 次</div><span class="small muted">仅包含主动记录</span>`)}${card(`<div class="muted">主动暂停</div><div class="metric">${state.insight===7?'3':'11'} 次</div><span class="small muted">包含 SOS 与主动停止</span>`)}</div><div class="grid g2" style="margin-top:18px">${card(`<h2>何时更容易出现冲动</h2><p class="muted small">按小时汇总的自述记录 · 样本量 ${state.insight===7?7:23}</p><div role="img" aria-label="演示数据：晚间记录较多" class="chart">${bars.map((x,i)=>`<div class="chartcol"><div class="bar" style="height:${x*1.8}px"></div>${i%4===0?String(i).padStart(2,'0'):''}</div>`).join('')}</div>`)}${card(`<h2>常见触发因素</h2><p class="muted small">一个事件可选多个因素，比例并非互斥</p>${[['疲劳','7'],['压力','5'],['无聊','4'],['睡不着','3']].map(([x,n])=>`<div class="item"><span>${x}</span><b>${n} 次</b></div>`).join('')}<p class="muted small" style="margin-top:18px">仅供观察；记录少时不作趋势结论。</p>`)}</div>`}
function journal(){return `${title('JOURNAL / 06','写给自己的几句话。','内容只属于你，什么时候写、写多少都由你。')}<div class="grid g2">${card(`<div class="row between"><h2>我的日记</h2>${btn('＋ 新建','new-journal','ghost')}</div>${state.journalSaved.map((x,i)=>`<button class="item" style="width:100%;background:none;color:var(--text);border-left:0;border-right:0;border-top:0;text-align:left" data-journal="${i}"><span><b>${i?'今天':'9 月 23 日'}</b><br><span class="muted small">${esc(x.slice(0,34))}…</span></span><span>›</span></button>`).join('')}`)}${card(`<h2>此刻的想法</h2><p class="muted small">写下感受，或记录一个你想记住的小选择。</p><div class="field"><label for="journalInput">正文</label><textarea id="journalInput" placeholder="从这里开始……">${esc(state.journalText)}</textarea></div><div class="actions">${btn('保存这段话','save-journal','primary')}${btn('清空编辑器','clear-journal','ghost')}</div>`)}</div>`}
function blocker(){return `${title('BLOCK / 07','降低访问的便利性。','浏览器扩展是第二阶段功能。此页展示规则与连接状态的设计。')}<div class="grid g2">${card(`<div class="row between"><h2>Firefox</h2><span class="pill">已连接 · 演示</span></div><p class="muted">规则版本 v2 · 上次同步 2 分钟前</p>${btn('预览拦截页面','blocked')}`)}${card(`<div class="row between"><h2>Chromium</h2><span class="pill warn">未连接</span></div><p class="muted">需要主动安装扩展并授予必要权限。</p>${btn('查看安装说明','install-info')}`)}</div><div class="grid g2" style="margin-top:18px">${card(`<div class="row between"><h2>我的域名规则</h2>${btn('＋ 添加域名','add-rule','ghost')}</div>${state.rules.map((x,i)=>`<div class="rule"><span><b>${esc(x)}</b><br><small class="muted">精确域名及子域名 · 全天</small></span><button class="toggle ${state.ruleOn[i]?'':'off'}" data-rule="${i}" aria-label="切换 ${esc(x)}" aria-pressed="${state.ruleOn[i]}"></button></div>`).join('')}`)}${card(`<h2>暂停与边界</h2><p class="muted">暂停会先等待 15 分钟，再由你确认。该规则只在已安装并启用扩展的浏览器配置文件中生效。</p><div class="line"></div>${btn('申请暂停屏蔽','pause','warn')}<p class="small muted">卸载扩展、使用其他浏览器或修改设置可能绕过规则。</p>`)}</div>`}
function settings(){return `${title('SETTINGS / 08','设置与隐私。','控制提醒、外观和本地数据。')}<div class="grid g2">${card(`<h2>外观与使用</h2><div class="rule"><span>浅色主题<br><small class="muted">跟随你的视觉偏好</small></span><button class="toggle ${state.light?'':'off'}" data-action="theme" aria-pressed="${state.light}"></button></div><div class="rule"><span>自动锁定<br><small class="muted">默认 10 分钟</small></span><span class="pill">10 分钟</span></div><div class="rule"><span>系统通知<br><small class="muted">默认关闭，内容保持中性</small></span><button class="toggle off" data-action="notify" aria-label="系统通知"></button></div><div class="rule"><span>全局 SOS 快捷键<br><small class="muted">X11 可配置，Wayland 视环境而定</small></span><span class="muted small">未设置</span></div>`)}${card(`<h2>我的数据</h2><p class="muted">正式产品必须加密后才可保存敏感内容。本原型仅在当前页面运行期间保存演示状态。</p><div class="actions">${btn('备份与恢复','backup')}${btn('导出与清除','export')}</div><div class="line"></div><p class="small muted">无账号 · 无云同步 · 无遥测</p>`)} </div><div style="margin-top:18px">${card(`<h2>原型评审入口</h2><p class="muted">以下流程供你检查所有独立页面。正式版不保留此入口。</p><div class="actions">${btn('首次引导','onboard')}${btn('锁定界面','lock')}${btn('扩展拦截页','blocked')}${btn('暂停弹窗','pause')}</div>`)}</div>`}
function onboard(){let steps=[`<div class="kicker">01 / 03 · 欢迎</div><h1>留一处安静的空间。</h1><p>观察自己的习惯，想暂停时有个入口。所有内容默认只留在这台设备上。</p><div class="line"></div><div class="pill">本地运行 · 无需账号</div>`,`<div class="kicker">02 / 03 · 方向</div><h1>你想改变什么？</h1><p>可以多选，也可以以后再改。自慰不自动算作失败。</p>${['减少色情内容浏览','减少深夜使用','观察冲动和触发因素','自定义目标'].map((x,i)=>`<label class="checkrow"><input type="checkbox" ${i===0?'checked':''}>${x}</label>`).join('')}`,`<div class="kicker">03 / 03 · 私密</div><h1>保护你的记录。</h1><p>正式版在此设置主密码并创建加密存储。密码遗失将无法恢复旧数据。</p><div class="field"><label for="passNew">设置密码（仅交互演示）</label><input id="passNew" type="password" autocomplete="new-password" placeholder="输入一个你能记住的密码"></div>`];return `<div class="onboard"><section class="panel"><div class="row" style="align-items:center;gap:12px"><i class="brandmark"></i><b>净界</b></div><div style="margin:35px 0">${steps[state.onStep]}</div><div class="row between">${btn('退出预览','exit-onboard','ghost')}<div class="actions">${state.onStep>0?btn('上一步','on-prev'):''}${btn(state.onStep===2?'进入今日':'下一步','on-next','primary')}</div></div></section></div>`}
function locked(){return `<div class="lockscreen"><section class="panel center"><i class="brandmark" style="display:inline-block"></i><h1>欢迎回来。</h1><p>你的记录已被遮盖。此处是解锁流程的交互预览。</p><div class="field" style="text-align:left"><label for="unlockInput">密码</label><input id="unlockInput" type="password" placeholder="输入密码以解锁"></div><div class="actions" style="justify-content:center">${btn('解锁原型','unlock','primary')}${btn('无需记录的 SOS','locked-sos','ghost')}</div><p class="small">正式产品须验证真实密钥，原型不保存密码。</p></section></div>`}
function blocked(){return `<div class="blocked"><section class="panel center"><div class="kicker">浏览器扩展 · 拦截页预览</div><div class="breath" style="width:120px;height:120px;font-size:42px">◌</div><h1>这个页面已被你的规则拦下。</h1><p>现在可以回到之前的页面，也可以先停一会儿。</p><div class="actions" style="justify-content:center;margin-top:25px">${btn('返回应用','exit-blocked','primary')}${btn('打开 SOS','go-sos')}${btn('申请暂停','pause','ghost')}</div><p class="small">只覆盖已连接的浏览器扩展；这里不会展示完整网址。</p></section></div>`}
function modal(){if(!state.modal)return '';let m=state.modal;let contents='';if(m==='record'){contents=`<h2>新建记录</h2><p class="muted">只写你愿意留下的部分。</p><div class="field"><label>发生了什么？</label><div class="seg">${['出现冲动','浏览内容','主动停止浏览','自慰','替代行动'].map(x=>`<button data-type="${x}" class="${state.recordType===x?'selected':''}">${x}</button>`).join('')}</div></div><div class="field"><label for="eventTime">发生时间</label><input id="eventTime" type="datetime-local"></div><div class="field"><label for="intensity">当时强度（可跳过）：<span id="rangeValue">5</span> / 10</label><input id="intensity" type="range" min="0" max="10" value="5" style="width:100%;accent-color:var(--accent)"></div><div class="field"><label>当时的状态（可多选）</label>${['无聊','压力','孤独','焦虑','疲劳','睡不着','性欲','习惯'].map(x=>`<button class="chip ${state.triggers.includes(x)?'selected':''}" data-trigger="${x}">${x}</button>`).join('')}</div><div class="field"><label for="eventNote">备注（可不填）</label><textarea id="eventNote" maxlength="2000" placeholder="当时发生了什么？"></textarea></div><div class="footer">${btn('取消','close','ghost')}${btn('保存记录','save-record','primary')}</div>`}else if(m==='pause'){contents=`<h2>申请暂停屏蔽</h2><p class="muted">先给自己留一点时间。之后仍由你决定是否暂停。</p><div class="card center" style="margin:22px 0"><div class="kicker">原型演示倒计时</div><div class="timer">00:${String(state.pauseRemaining).padStart(2,'0')}</div><p class="small muted">正式版默认 15 分钟；这里缩短至 8 秒便于查看交互。</p></div><div class="field"><label for="pauseReason">此刻为什么想暂停？（可不填）</label><input id="pauseReason" type="text" placeholder="先写一句也可以"></div><div class="footer">${btn('取消','close','ghost')}${btn('确认暂停 10 分钟','pause-confirm','primary') .replace('class="btn primary"',`class="btn primary" ${state.pauseRemaining>0?'disabled':''}`)}</div>`}else{let messages={"edit-goal":['编辑目标','正式版允许修改目标、原因与提醒；改动不会清除历史记录。'],"pause-goal":['暂停目标','暂停后，之前的记录仍会保留。'],"add-action":['添加小行动','正式版在此输入行动名称和重复频率。'],"add-rule":['添加域名规则','示例将添加 quiet.example。正式版先校验标准化域名，再发布版本化规则。'],"install-info":['连接浏览器扩展','正式版分别提供 Firefox 与 Chromium 的安装、授权、状态诊断。'],"backup":['备份与恢复','正式版默认创建加密备份，恢复前验证密码和文件完整性。'],"export":['导出与清除','正式版导出或清除前必须重新认证并告知数据范围。'],"notify":['提醒设置','提醒默认关闭，且通知内容保持中性。']};let [h,p]=messages[m]||['提示','这是原型交互。'];contents=`<h2>${h}</h2><p class="muted">${p}</p><div class="footer">${btn('关闭','close')}${m==='add-rule'?btn('添加示例规则','confirm-rule','primary'):''}</div>`}return `<div class="over" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${m==='record'?'新建记录':m==='pause'?'申请暂停屏蔽':'操作预览'}">${contents}</section></div>`}
function render(){document.body.classList.toggle('theme-light',state.light);app.innerHTML=state.locked?locked():state.page==='onboard'?onboard():state.page==='blocked'?blocked():shell(({today,records,sos,plan,insights,journal,blocker,settings})[state.page]());app.insertAdjacentHTML('beforeend',modal());if(state.modal==='record'){let input=document.getElementById('eventTime');if(input&&!input.value){let d=new Date();input.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}}}
function toast(message){let old=document.querySelector('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),2800)}function stop(){clearInterval(state.interval);state.interval=null}function startSos(){stop();state.phase='running';state.interval=setInterval(()=>{if(state.seconds>0){state.seconds--;let x=document.querySelector('.timer');if(x)x.textContent=`${String(Math.floor(state.seconds/60)).padStart(2,'0')}:${String(state.seconds%60).padStart(2,'0')}`}else{stop();state.phase='done';render()}},1000);render()}function startPause(){clearInterval(state.pauseTimer);state.pauseRemaining=8;state.modal='pause';state.pauseTimer=setInterval(()=>{if(state.pauseRemaining>0){state.pauseRemaining--;let el=document.querySelector('.modal .timer');if(el)el.textContent=`00:${String(state.pauseRemaining).padStart(2,'0')}`;let b=document.querySelector('[data-action="pause-confirm"]');if(b)b.disabled=state.pauseRemaining>0}else{clearInterval(state.pauseTimer);state.pauseTimer=null}},1000);render()}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;state.modal=null;stop();render();return}let d=e.target.closest('[data-delete]');if(d){state.records.splice(+d.dataset.delete,1);render();toast('演示记录已移除');return}let v=e.target.closest('[data-insight]');if(v){state.insight=+v.dataset.insight;render();return}let j=e.target.closest('[data-journal]');if(j){state.journalText=state.journalSaved[+j.dataset.journal];render();return}let type=e.target.closest('[data-type]');if(type){state.recordType=type.dataset.type;document.querySelectorAll('[data-type]').forEach(el=>el.classList.toggle('selected',el===type));return}let tr=e.target.closest('[data-trigger]');if(tr){let x=tr.dataset.trigger;state.triggers=state.triggers.includes(x)?state.triggers.filter(a=>a!==x):[...state.triggers,x];tr.classList.toggle('selected');return}let rule=e.target.closest('[data-rule]');if(rule){let i=+rule.dataset.rule;state.ruleOn[i]=!state.ruleOn[i];render();toast('演示规则状态已更新');return}let a=e.target.closest('[data-action]');if(!a)return;let action=a.dataset.action;switch(action){case'record':state.modal='record';state.triggers=[];state.recordType='出现冲动';render();break;case'close':state.modal=null;clearInterval(state.pauseTimer);render();break;case'save-record':{let time=document.getElementById('eventTime')?.value||'';let note=document.getElementById('eventNote')?.value||'';state.records.unshift({type:state.recordType,when:time?time.replace('T',' '):'刚刚',triggers:state.triggers.join(' · '),note});state.modal=null;state.page='records';render();toast('演示记录已保存');break}case'go-sos':state.locked=false;state.page='sos';state.modal=null;state.phase='ready';state.seconds=90;render();break;case'sos-start':startSos();break;case'sos-pause':stop();state.phase='paused';render();break;case'sos-resume':startSos();break;case'sos-done':stop();state.phase='done';render();break;case'sos-reset':stop();state.phase='ready';state.seconds=90;render();break;case'sos-choice':toast(`可以先试试：${a.dataset.value}`);break;case'sos-finish':stop();state.phase='ready';state.seconds=90;state.page='today';render();toast('你随时可以再回来');break;case'save-journal':{let x=document.getElementById('journalInput')?.value.trim();if(!x){toast('可以先写下一句话');break}state.journalSaved.unshift(x);state.journalText='';render();toast('演示日记已保存');break}case'clear-journal':state.journalText='';render();break;case'new-journal':state.journalText='';render();document.getElementById('journalInput')?.focus();break;case'pause':startPause();break;case'pause-confirm':if(state.pauseRemaining===0){state.modal=null;render();toast('演示：规则暂停 10 分钟')}break;case'theme':state.light=!state.light;render();break;case'lock':state.locked=true;state.modal=null;render();break;case'unlock':state.locked=false;state.page='today';render();break;case'locked-sos':state.locked=false;state.page='sos';render();break;case'onboard':state.page='onboard';state.onStep=0;render();break;case'on-next':if(state.onStep<2)state.onStep++;else{state.page='today';toast('欢迎进入原型')}render();break;case'on-prev':state.onStep--;render();break;case'exit-onboard':state.page='settings';render();break;case'blocked':state.page='blocked';render();break;case'exit-blocked':state.page='blocker';render();break;case'confirm-rule':state.rules.push('quiet.example');state.ruleOn.push(true);state.modal=null;render();toast('已添加示例规则');break;default:state.modal=action;render()}});
document.addEventListener('change',e=>{if(e.target.dataset.plan!==undefined){state.plan[+e.target.dataset.plan]=e.target.checked;render()}if(e.target.id==='urgeRange')document.getElementById('urgeValue').textContent=e.target.value;if(e.target.id==='intensity')document.getElementById('rangeValue').textContent=e.target.value});document.addEventListener('input',e=>{if(e.target.id==='urgeRange')document.getElementById('urgeValue').textContent=e.target.value;if(e.target.id==='intensity')document.getElementById('rangeValue').textContent=e.target.value;if(e.target.id==='journalInput')state.journalText=e.target.value});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;clearInterval(state.pauseTimer);render()}});render();
</script></body></html>
